version: '3.8'

services:
  postgres:
    image: postgres:16.4
    container_name: postgres-db
    environment:
      POSTGRES_USER: your_user
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  application:
    image: python:3.12.4
    container_name: application
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "main.py"]
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
